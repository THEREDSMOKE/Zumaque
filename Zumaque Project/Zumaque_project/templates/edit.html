<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Editar Pago</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-warning">
            <h3>Editar Pago #{{ payment.payID }}</h3>
        </div>
        <div class="card-body">
            {% with messages = get_flashed_messages() %}
            {% if messages %}
            <div class="alert alert-danger">
                {{ messages[0] }}
            </div>
            {% endif %}
            {% endwith %}
            <form action="/payments/edit/{{ payment.payID }}" method="POST">
                <div class="mb-3">
                    <label for="accountID" class="form-label">ID de la Cuenta</label>
                    <select class="form-control" id="accountID" name="accountID" required>
                        {% for account in accounts %}
                        <option value="{{ account.ID }}" {{ 'selected' if account.ID == payment.accountID else '' }}>{{ account.ID }} - {{ account.concept }}</option>
                        {% endfor %}
                    </select>
                </div>
                <div class="mb-3">
                    <label for="amount_paid" class="form-label">Monto Pagado</label>
                    <input type="number" step="0.01" class="form-control" id="amount_paid" name="amount_paid" value="{{ payment.amount_paid }}" required>
                </div>
                <div class="mb-3">
                    <label for="method" class="form-label">Método de Pago</label>
                    <input type="text" class="form-control" id="method" name="method" value="{{ payment.method }}" maxlength="50">
                </div>
                <div class="mb-3">
                    <label for="payment_date" class="form-label">Fecha de Pago</label>
                    <input type="date" class="form-control" id="payment_date" name="payment_date" value="{{ payment.payment_date|iso_date }}" required>
                </div>
                <input type="hidden" name="payID" value="{{ payment.payID }}">
                <button type="submit" class="btn btn-primary">Actualizar Cambios</button>
                <a href="/payments" class="btn btn-secondary">Volver</a>
            </form>
        </div>
    </div>
</body>
</html>
