<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Eliminar Pago</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
    <div class="alert alert-danger shadow">
        <h4 class="alert-heading">¿Está seguro de eliminar este pago?</h4>
        <p>Esta acción es irreversible. Se eliminará el registro del pago con ID <strong>#{{ payment_id }}</strong> de la base de datos.</p>
        <hr>
        <form action="/payments/delete/{{ payment_id }}" method="POST">
            <button type="submit" class="btn btn-danger">Confirmar Eliminación</button>
            <a href="/payments" class="btn btn-secondary">Cancelar y Volver</a>
        </form>
    </div>
</body>
</html>
