{% extends "layout.html" %}
{% block title %}Registrar Pago{% endblock %}
{% block content %}
<div class="card shadow-sm mx-auto" style="max-width: 500px;">
    <div class="card-header bg-primary text-white">
        <h4 class="mb-0">Nuevo Pago</h4>
    </div>
    <div class="card-body">
        {% with messages = get_flashed_messages() %}
        {% if messages %}
        <div class="alert alert-danger">
            {{ messages[0] }}
        </div>
        {% endif %}
        {% endwith %}
        <form method="POST">
            <div class="mb-3">
                <label class="form-label">ID Cuenta</label>
                <select name="accountID" class="form-control" required>
                    {% for account in accounts %}
                    <option value="{{ account.ID }}">{{ account.ID }} - {{ account.concept }}</option>
                    {% endfor %}
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label">Monto a Pagar</label>
                <input type="number" step="0.01" name="amount_paid" class="form-control" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Método de Pago</label>
                <input type="text" name="method" class="form-control" placeholder="Ej: Transferencia" required>
            </div>
            <div class="mb-3">
                <label class="form-label">Fecha de Pago</label>
                <input type="date" name="payment_date" class="form-control" required>
            </div>
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-success flex-grow-1">Registrar</button>
                <a href="{{ url_for('index_payments') }}" class="btn btn-secondary">Cancelar</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
